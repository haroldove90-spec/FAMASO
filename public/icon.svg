<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="50%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <linearGradient id="aquaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Rounded Container with Safe Margin -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bgGrad)" stroke="#334155" stroke-width="4" />

  <!-- Road Speed Ribbons -->
  <path d="M 80 340 L 432 340" stroke="#334155" stroke-width="8" stroke-linecap="round" />
  <path d="M 120 370 L 392 370" stroke="#EA580C" stroke-width="6" stroke-dasharray="24 16" stroke-linecap="round" />

  <!-- Center Vehicle/Fleet Shield Motif -->
  <g filter="url(#shadow)">
    <!-- Food Transport / Delivery Truck Outline in Crisp Modern White & Orange -->
    <path d="M 120 280 L 120 180 C 120 170 128 162 138 162 L 310 162 C 316 162 322 165 326 170 L 370 216 C 374 220 376 226 376 232 L 376 280 C 376 286 371 292 365 292 L 131 292 C 125 292 120 286 120 280 Z" fill="#FFFFFF" />
    
    <!-- Truck Cab Accent & Window -->
    <path d="M 314 176 L 358 220 C 360 222 362 225 362 228 L 362 236 L 314 236 Z" fill="#0F172A" />
    <path d="M 134 176 L 298 176 L 298 278 L 134 278 Z" fill="#F8FAFC" />

    <!-- Wash & Clean Water Droplet + Sparkle overlay -->
    <circle cx="216" cy="226" r="38" fill="url(#aquaGrad)" opacity="0.9" />
    <path d="M 216 194 C 216 194 236 220 236 232 C 236 243 227 252 216 252 C 205 252 196 243 196 232 C 196 220 216 194 216 194 Z" fill="#FFFFFF" />
    
    <!-- Sparkles -->
    <path d="M 268 140 L 274 154 L 288 160 L 274 166 L 268 180 L 262 166 L 248 160 L 262 154 Z" fill="#FBBF24" />
    <path d="M 152 132 L 155 141 L 164 144 L 155 147 L 152 156 L 149 147 L 140 144 L 149 141 Z" fill="#38BDF8" />

    <!-- Wheels with Rims -->
    <circle cx="176" cy="292" r="28" fill="#1E293B" stroke="#F8FAFC" stroke-width="5" />
    <circle cx="176" cy="292" r="12" fill="#F97316" />

    <circle cx="328" cy="292" r="28" fill="#1E293B" stroke="#F8FAFC" stroke-width="5" />
    <circle cx="328" cy="292" r="12" fill="#F97316" />
  </g>

  <!-- Typography: FAMASO & FAST FOOD ROAD -->
  <g text-anchor="middle">
    <text x="256" y="420" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="40" letter-spacing="4" fill="#FFFFFF">FAMASO</text>
    <text x="256" y="450" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="16" letter-spacing="6" fill="#FB923C">FAST FOOD ROAD</text>
  </g>
</svg>
